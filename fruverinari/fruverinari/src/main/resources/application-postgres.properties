# ------------------ PostgreSQL (cuando tengas la base de datos) ------------------
# Ejecutar con: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/fruver_inari_db
spring.datasource.username=user_java
