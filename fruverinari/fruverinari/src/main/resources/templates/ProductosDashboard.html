<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/layout :: head">
</head>
<body>

<nav th:replace="layout/layout :: navbar"></nav>

<div class="container py-5">

    <h2 class="fw-bold mb-5 text-primary">
        <i class="bi bi-graph-up"></i> Dashboard de Inventario
    </h2>

    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card p-4 shadow-sm">
                <h4 class="mb-3 card-title text-center">Stock Actual por Producto</h4>
                <canvas id="graficoStockProductos" height="150"></canvas>
            </div>
        </div>
    </div>

</div>

<footer th:replace="layout/layout :: footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script th:inline="javascript">
    // 1. LECTURA DE DATOS DEL MODELO DE SPRING
    // Usamos th:inline="javascript" para inyectar la lista 'productos'
    var productosData = /*[[${productos}]]*/ [];

    // --- 2. PREPARACIÓN DE DATOS PARA CHART.JS ---

    // Extraer nombres (labels) y cantidades (data)
    var nombresProductos = productosData.map(function(p) {
        return p.nombre;
    });

    var stockCantidades = productosData.map(function(p) {
        return p.cantidad;
    });

    // Configuración de colores (para que se vea bien)
    var coloresBarra = nombresProductos.map((_, index) =>
        index % 2 === 0 ? 'rgba(75, 192, 192, 0.8)' : 'rgba(54, 162, 235, 0.8)'
    );


    // --- 3. DIBUJO DE LA GRÁFICA ---

    var ctx = document.getElementById('graficoStockProductos').getContext('2d');

    var miGrafica = new Chart(ctx, {
        type: 'bar', // Gráfica de barras
        data: {
            labels: nombresProductos,
            datasets: [{
                label: 'Stock Actual',
                data: stockCantidades,
                backgroundColor: coloresBarra,
                borderColor: coloresBarra.map(c => c.replace('0.8', '1')),
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false, // Permite controlar el tamaño con la altura del canvas
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Cantidad en Unidades'
                    }
                }
            },
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                }
            }
        }
    });
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
