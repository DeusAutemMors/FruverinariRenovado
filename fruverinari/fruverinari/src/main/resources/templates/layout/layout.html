<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} ?: 'Fruver Inari'">Fruver Inari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar {
            background: #7bd389 !important;
        }
        .navbar-brand {
            font-weight: 700;
            color: #2e7d32 !important;
        }
        .nav-link, .navbar .dropdown-toggle {
            color: #2e7d32 !important;
            font-weight: 500;
            white-space: nowrap;
        }
        .nav-link:hover, .navbar .dropdown-toggle:hover {
            text-decoration: underline;
        }
        .navbar-nav {
            flex-wrap: wrap;
            row-gap: 0.15rem;
        }
        .navbar .dropdown-menu {
            border: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        footer {
            background-color: #f8f9fa;
        }
        .alert-active {
            background-color: #ffc107;
            border-radius: 5px;
        }
        @media (max-width: 1199px) {
            .navbar-nav {
                padding-bottom: 0.5rem;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light" th:fragment="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Fruver Inari</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navMain" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Gestión
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/productos}">Productos</a></li>
                        <li><a class="dropdown-item" th:href="@{/proveedores}">Proveedores</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown" sec:authorize="hasAnyRole('ADMIN','CAJERO')">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Caja
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/cajero/consultarInventario}">Consultar Inventario</a></li>
                        <li><a class="dropdown-item" th:href="@{/cajero/registrarMovimiento}">Registrar Movimiento</a></li>
                        <li><a class="dropdown-item" th:href="@{/cajero/reporte}">Generar Reporte</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown" sec:authorize="hasAnyRole('ADMIN','CAJERO')">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Historial
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/movimientos/historial}">Movimientos</a></li>
                        <li><a class="dropdown-item" th:href="@{/historial}">Historial general</a></li>
                    </ul>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','CAJERO')">
                    <a class="nav-link" th:href="@{/nutricion}">
                        <i class="bi bi-heart-pulse"></i> Plan Nutricional
                    </a>
                </li>

                <li class="nav-item me-3" sec:authorize="hasAnyRole('ADMIN','CAJERO')"
                    th:classappend="${alertasCount != null and alertasCount > 0 ? 'alert-active' : ''}">
                    <a class="nav-link" th:href="@{/alertas}" title="Alertas por bajo inventario">
                        <i class="bi bi-bell-fill"></i> Alertas
                        <span th:if="${alertasCount != null and alertasCount > 0}"
                              class="badge text-bg-danger rounded-pill"
                              th:text="${alertasCount}"
                              style="margin-left: 5px;"></span>
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-dark btn-sm">Salir</button>
                </form>
            </div>

            <div class="d-flex align-items-center" sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-dark btn-sm" th:href="@{/Login}">Iniciar sesión</a>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="text-center text-muted mt-5 py-3 border-top">
    <small>&copy; 2025 Fruver Inari – Gestor de Inventario</small>

    <script th:if="${alertasCount != null and alertasCount > 0}">
        function reproducirAlerta() {
            const audio = new Audio('/audio/alerta.mp3');
            audio.volume = 0.5;
            audio.play().catch(error => {
                console.warn("La reproduccion automatica de audio fue bloqueada:", error);
            });
        }
        window.onload = reproducirAlerta;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
