<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/layout :: head"></head>
<body>

<nav th:replace="layout/layout :: navbar"></nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4 text-success"><i class="bi bi-truck"></i> Lista de Proveedores</h2>

    <div class="mb-3 text-end">
        <a th:href="@{/proveedores/registrar}" class="btn btn-success">
            <i class="bi bi-person-plus"></i> Registrar nuevo proveedor
        </a>
    </div>


    <label>Proveedor:</label>
    <select class="form-select">
        <option value="">Seleccione un proveedor</option>
        <option th:each="prov : ${proveedores}"
                th:value="${prov.id}"
                th:text="${prov.nombre}">
        </option>
    </select>


    <table class="table table-striped table-bordered align-middle shadow-sm">
        <thead class="table-success text-center">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody class="text-center">
        <tr th:each="proveedor : ${proveedores}">
            <td th:text="${proveedor.id}"></td>
            <td th:text="${proveedor.nombre}"></td>
            <td th:text="${proveedor.telefono}"></td>
            <td th:text="${proveedor.correo}"></td>
            <td th:text="${proveedor.direccion}"></td>
            <td>
                    <span th:text="${proveedor.estado}"
                          th:classappend="${proveedor.activo} ? 'badge bg-success' : 'badge bg-danger'"></span>
            </td>
            <td>
                <a th:href="@{'/proveedores/editar/' + ${proveedor.id}}" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-pencil"></i> Editar
                </a>
                <form th:action="@{'/proveedores/suspender/' + ${proveedor.id}}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-x-circle"></i> Suspender
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="layout/layout :: footer"></footer>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
