<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

<nav th:replace="~{layout/layout :: navbar}"></nav>

<div class="container mt-5">
    <h2 class="mb-3 fw-bold">Editar Producto</h2>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="row mb-3">
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label fw-bold">ID del Producto</label>
                    <input type="text" class="form-control" th:value="*{id}" disabled>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label fw-bold">Nombre del Producto</label>
                    <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre del producto" required>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-12">
                <div class="form-group">
                    <label class="form-label fw-bold">Descripción</label>
                    <input type="text" class="form-control" th:field="*{descripcion}" placeholder="Descripción del producto" required>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label fw-bold">Precio</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" placeholder="Precio del producto" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label fw-bold">Cantidad (Stock Actual)</label>
                    <input type="number" class="form-control" th:field="*{cantidad}" placeholder="Cantidad en inventario" required min="0">
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label fw-bold text-danger">Stock Mínimo (Umbral de Alerta)</label>
                    <input type="number"
                           class="form-control"
                           th:field="*{stockMinimo}"
                           placeholder="Stock mínimo para generar alerta"
                           required
                           min="0">
                </div>
            </div>
            <div class="col-md-6">
            </div>
        </div>

        <button type="submit" class="btn btn-success me-2">
            <i class="bi bi-save"></i> Actualizar Producto
        </button>
        <a th:href="@{/productos}" class="btn btn-secondary">
            <i class="bi bi-x-circle"></i> Cancelar
        </a>

    </form>
</div>

<footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
