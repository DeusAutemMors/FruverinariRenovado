<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header">
    <meta charset="UTF-8">
    <title>Mi Proyecto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Navbar</a>
    </div>
</nav>

<div th:fragment="cards">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <!-- Card Empresa -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Empresa</h5>
                        <p class="card-text">Actividades empresariales</p>
                    </div>
                </div>
            </div>
            <!-- Card Desarrollo -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Desarrollo</h5>
                        <p class="card-text">MVC - Contenido Web - Arquitectura Java</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:fragment="footer" class="mt-5 py-4">
    <p class="text-center mb-0">&copy; David Jimenez</p>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
