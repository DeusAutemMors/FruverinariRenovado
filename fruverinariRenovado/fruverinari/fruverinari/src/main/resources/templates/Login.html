<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Fruver Inari</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffcf71, #50d890);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 32px 16px;
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                    radial-gradient(circle at 20% 30%, rgba(255,80,80,0.25) 10px, transparent 70px),
                    radial-gradient(circle at 80% 20%, rgba(255,200,0,0.25) 12px, transparent 80px),
                    radial-gradient(circle at 50% 80%, rgba(160,230,80,0.25) 12px, transparent 70px),
                    radial-gradient(circle at 30% 70%, rgba(255,130,0,0.25) 12px, transparent 90px);
            z-index: 0;
            background-size: cover;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: #ffffffd0;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.20);
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(7px);
            margin: auto;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
            color: #0a7517;
        }

        .nav-tabs .nav-link {
            color: #2e7d32;
            font-weight: 600;
            border: none;
            border-radius: 10px 10px 0 0;
        }

        .nav-tabs .nav-link.active {
            background: #4bb543;
            color: #fff;
        }

        .input-group-text {
            background: #4bb543;
            color: #fff;
            border: none;
            border-radius: 10px 0 0 10px;
        }

        .form-control {
            border-radius: 0 10px 10px 0;
            border: 2px solid #b8e986;
        }

        .form-control:focus {
            border-color: #3d9438;
            box-shadow: 0 0 6px rgba(75,181,67,0.4);
        }

        .btn-primary {
            background-color: #4bb543;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #3d9438;
        }

        .btn-outline-success {
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
            border-width: 2px;
        }

        .footer-text {
            text-align: center;
            margin-top: 15px;
            color: #444;
            font-size: 0.95rem;
            background: #ffffff80;
            padding: 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Bienvenido al Fruver INARI</h2>

    <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${tabActiva == 'login' ? 'active' : ''}"
               id="login-tab" data-toggle="tab" href="#login-panel" role="tab">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${tabActiva == 'registro' ? 'active' : ''}"
               id="registro-tab" data-toggle="tab" href="#registro-panel" role="tab">
                <i class="fa-solid fa-user-plus"></i> Registrarse
            </a>
        </li>
    </ul>

    <div class="tab-content" id="authTabsContent">

        <!-- PESTAÑA LOGIN -->
        <div class="tab-pane fade"
             th:classappend="${tabActiva == 'login' ? 'show active' : ''}"
             id="login-panel" role="tabpanel">

            <div th:if="${registroOk}" class="alert alert-success" th:text="${registroOk}"></div>

            <form th:action="@{/Login}" method="post">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        </div>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="password">Contraseña</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        </div>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-4">
                    <i class="fa-solid fa-door-open"></i> Entrar
                </button>
            </form>

            <div th:if="${param.error}" class="alert alert-danger mt-3">
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alert alert-success mt-3">
                Has cerrado sesión con éxito.
            </div>

            <button type="button" class="btn btn-outline-success mt-3"
                    onclick="document.getElementById('registro-tab').click()">
                <i class="fa-solid fa-user-plus"></i> Crear cuenta nueva
            </button>
        </div>

        <!-- PESTAÑA REGISTRO -->
        <div class="tab-pane fade"
             th:classappend="${tabActiva == 'registro' ? 'show active' : ''}"
             id="registro-panel" role="tabpanel">

            <div th:if="${registroError}" class="alert alert-danger" th:text="${registroError}"></div>

            <form th:action="@{/registro}" method="post">
                <div class="form-group">
                    <label for="reg-username">Usuario</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        </div>
                        <input type="text" id="reg-username" name="username" class="form-control"
                               placeholder="Elige un nombre de usuario" required minlength="3" maxlength="50">
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="reg-password">Contraseña</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        </div>
                        <input type="password" id="reg-password" name="password" class="form-control"
                               placeholder="Minimo 4 caracteres" required minlength="4">
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="reg-confirm">Confirmar contraseña</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        </div>
                        <input type="password" id="reg-confirm" name="confirmPassword" class="form-control"
                               placeholder="Repite tu contraseña" required minlength="4">
                    </div>
                </div>

                <div class="form-group mt-3">
                    <p class="text-muted mb-0">
                        Te registras como <strong>cliente</strong>: recetas, productos recomendados y puntos por compras.
                    </p>
                    <input type="hidden" name="rol" value="CLIENTE">
                </div>

                <button type="submit" class="btn btn-primary mt-4">
                    <i class="fa-solid fa-user-check"></i> Registrarme
                </button>
            </form>

            <button type="button" class="btn btn-outline-success mt-3"
                    onclick="document.getElementById('login-tab').click()">
                <i class="fa-solid fa-right-to-bracket"></i> Ya tengo cuenta — Iniciar sesión
            </button>
        </div>
    </div>

    <div class="footer-text mt-3">
        Gracias por hacer este fruver mas fresco cada dia
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
