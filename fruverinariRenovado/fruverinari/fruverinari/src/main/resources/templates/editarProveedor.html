<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

<!-- Barra de navegación -->
<nav th:replace="~{layout/layout :: navbar}"></nav>

<!-- Formulario para editar proveedor -->
<div class="container mt-5">
  <h1 class="mb-3">Editar Proveedor</h1>
  <form th:action="@{/proveedores/editar}" method="post">
    <div class="form-group">
      <label for="idProveedor">ID del Proveedor</label>
      <input type="text" class="form-control" id="idProveedor" name="idProveedor" placeholder="ID del proveedor" required>
    </div>
    <div class="form-group">
      <label for="nombre">Nombre del Proveedor</label>
      <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre del proveedor" required>
    </div>
    <div class="form-group">
      <label for="direccion">Dirección</label>
      <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Dirección del proveedor" required>
    </div>
    <button type="submit" class="btn btn-success">Actualizar Proveedor</button>
  </form>
</div>

<!-- Pie de página -->
<footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
