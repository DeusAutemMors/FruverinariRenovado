<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/layout :: head"></head>
<body>
<nav th:replace="layout/layout :: navbar"></nav>

<div class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-success"><i class="bi bi-gift"></i> Ofertas y puntos</h2>
        <p class="text-muted">
            Tienes <strong class="text-success" th:text="${puntosCliente}">0</strong> puntos.
            Canjealos por descuentos o premios de tienda.
        </p>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3 mb-5">
        <div class="col-md-6" th:each="oferta : ${ofertas}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${oferta.titulo}">Oferta</h5>
                    <p class="card-text" th:text="${oferta.descripcion}">Detalle</p>
                    <p class="fw-semibold text-success" th:text="${oferta.puntosRequeridos} + ' puntos'"></p>
                    <p class="small text-muted" th:if="${oferta.descuentoPorcentaje > 0}"
                       th:text="'Aplica ' + ${oferta.descuentoPorcentaje} + '% en la siguiente compra.'"></p>
                    <form class="mt-auto" th:action="@{/cliente/canjear}" method="post">
                        <input type="hidden" name="ofertaId" th:value="${oferta.id}">
                        <button class="btn btn-success w-100"
                                th:disabled="${puntosCliente < oferta.puntosRequeridos}">
                            Canjear
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-12 text-muted" th:if="${ofertas == null or ofertas.isEmpty()}">
            No hay ofertas activas.
        </div>
    </div>

    <h4 class="text-success mb-3">Historial de canjes</h4>
    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>Oferta</th>
                <th>Puntos</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="canje : ${canjes}">
                <td th:text="${canje.oferta.titulo}">Oferta</td>
                <td th:text="${canje.puntosUsados}">0</td>
                <td th:text="${#temporals.format(canje.fechaCanje, 'dd/MM/yyyy HH:mm')}">fecha</td>
            </tr>
            <tr th:if="${canjes == null or canjes.isEmpty()}">
                <td colspan="3" class="text-muted">Aun no has canjeado ofertas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
