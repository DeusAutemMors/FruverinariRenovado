<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/layout :: head"></head>
<body>

<nav th:replace="layout/layout :: navbar"></nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4 text-success">
        <i class="bi bi-graph-up-arrow"></i> Reporte de Movimientos
    </h2>

    <div class="card shadow-sm p-4 mb-4">
        <form th:action="@{/cajero/reporte}" method="get" class="row g-3 align-items-end">

            <div class="col-md-3">
                <label class="form-label fw-semibold">Fecha Inicio</label>
                <input type="date" class="form-control" name="inicio" required
                       th:value="${fechaInicio}">
            </div>

            <div class="col-md-3">
                <label class="form-label fw-semibold">Fecha Fin</label>
                <input type="date" class="form-control" name="fin" required
                       th:value="${fechaFin}">
            </div>

            <div class="col-md-3">
                <label class="form-label fw-semibold">Producto</label>
                <select class="form-select" name="idProducto">

                    <option value="0"
                            th:selected="${productoSeleccionadoId == null or productoSeleccionadoId == 0}">
                        -- Todos los Productos --
                    </option>

                    <option
                            th:each="p : ${productosDisponibles}"
                            th:value="${p.id}"
                            th:text="${p.nombre}"
                            th:selected="${p.id == productoSeleccionadoId}">
                    </option>
                </select>
            </div>

            <div class="col-md-3 text-end">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-search"></i> Generar Reporte
                </button>

                <a th:href="@{/cajero/reporte/pdf(inicio=${fechaInicio != null ? fechaInicio : '2025-01-01'}, fin=${fechaFin != null ? fechaFin : '2025-12-31'}, idProducto=${productoSeleccionadoId})}"
                   class="btn btn-primary ms-2">
                    <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
                </a>

            </div>
        </form>
    </div>

    <table class="table table-striped table-bordered align-middle shadow-sm">
        <thead class="table-success text-center">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Monto</th>
            <th>Fecha</th>
        </tr>
        </thead>

        <tbody class="text-center">
        <tr th:each="mov : ${movimientos}">
            <td th:text="${mov.id}"></td>
            <td th:text="${mov.tipoMovimiento}"></td>
            <td th:text="${mov.producto != null ? mov.producto.nombre : '-'}"></td>
            <td th:text="${mov.cantidad}"></td>
            <td th:text="${#numbers.formatDecimal(mov.monto, 1, 'POINT', 2, 'NONE')}"></td>
            <td th:text="${#temporals.format(mov.fechaMovimiento, 'dd/MM/yyyy')}"></td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="layout/layout :: footer"></footer>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
