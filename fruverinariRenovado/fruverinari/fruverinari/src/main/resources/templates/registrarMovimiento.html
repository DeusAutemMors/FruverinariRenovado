<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

<!-- Barra de navegación -->
<nav th:replace="~{layout/layout :: navbar}"></nav>

<!-- Formulario para registrar movimiento -->
<div class="container mt-5">
    <h1 class="mb-3">Registrar Movimiento de Inventario</h1>
    <form th:action="@{/movimientos/registrar}" method="post">
        <div class="form-group">
            <label for="producto">Producto</label>
            <input type="text" class="form-control" id="producto" name="producto" placeholder="Producto involucrado" required>
        </div>
        <div class="form-group">
            <label for="tipoMovimiento">Tipo de Movimiento</label>
            <select class="form-control" id="tipoMovimiento" name="tipoMovimiento" required>
                <option value="entrada">Entrada</option>
                <option value="salida">Salida</option>
            </select>
        </div>
        <div class="form-group">
            <label for="cantidad">Cantidad</label>
            <input type="number" class="form-control" id="cantidad" name="cantidad" placeholder="Cantidad del movimiento" required>
        </div>
        <button type="submit" class="btn btn-primary">Registrar Movimiento</button>
    </form>
</div>

<!-- Pie de página -->
<footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
